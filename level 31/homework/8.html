<!-- 8)შექმენით  div,სადაც უნდა იყოს h1,p
->div<-
1)უკანა ფერი უნდა იყოს ნაცრისფერი

->h1<-
1)უნდა იყოს ვარდისფერი
2)უკანა ფერი უნდა იყოს მწვანე
3)უნდა იყოს ცენტრში
->p<-
1)უნდა იყოს 30px
2)უნდა იყოს ცენტრში -->

<!DOCTYPE html>
<html>

<head>
    <style>
        div {
            background-color: gray;
        }

        h1 {
            color: pink;
            background-color: green;
            text-align: center;
        }

        p {
            font-size: 30px;
            text-align: center;
        }
    </style>
</head>

<body>

    <div>
        <h1>goa</h1>
        <p>goa</p>
    </div>

</body>

</html>
