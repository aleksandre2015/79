<!-- 3. შექმენი HTML ფაილი და დაამატე:
- <h1>
- <p>
- <button>
    გამოიყენე internal CSS და თითოეულ ელემენტს განსხვავებული:
- ტექსტის ფერი
- ფონური ფერი
- ტექსტის ზომა -->

<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internal CSS Example</title>

    <style>
        h1 {
            color: blue;
            background-color: lightgray;
            
        }

        p {
            color: green;
            background-color: yellow;
            
        }

        button {
            color: white;
            background-color: red;
            
        }
    </style>
</head>
<body>

    <h1>ეს არის სათაური</h1>

    <p>ეს არის პარაგრაფი Internal CSS-ით.</p>

    <button>დამაჭირე თორე აგაძორბ თავს</button>

</body>
</html>
